# App-only stack for horizontal app nodes (RxVisionSRV02+). No state services here —
# Mongo/Redis live on RxVisionDB01 (10.0.0.3); Vault stays on RxVisionSRV01, reached over
# the private net via the socat proxy on 10.0.0.2:8200 (see PHASE1-app-node.md).
# The node's .env must point MONGODB_URI/REDIS_URL → 10.0.0.3 and VAULT_ADDR → https://10.0.0.2:8200
# (TLS — H-3, 2026-07-03) + VAULT_CACERT=/vault/tls/vault.crt. Ship infra/docker/vault/tls/vault.crt to
# the node; the cert's SAN includes IP:10.0.0.2 so verification succeeds over the socat hop.
# NOTE: no `beat` here — the Celery scheduler is a singleton and runs ONLY on SRV01.
# RAM-rebalance (2026-07-02): the heavy ingestion workers (backfill + optical) run HERE on the
# idle SRV01, OFF the overloaded MGMT01. --max-tasks-per-child recycles procs to cap memory creep.
# Hardening: every app container drops ALL Linux capabilities + no-new-privileges (non-root already).
name: rxvision-app
services:
  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    expose: ["8000"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - "./infra/docker/vault/tls/vault.crt:/vault/tls/vault.crt:ro"
  # ── ΧΩΡΙΣΤΟΙ ΔΡΟΜΟΙ (19/09/2026) ────────────────────────────────────────────────────
  # Πριν: ΕΝΑΣ worker με 2 θέσεις κουβαλούσε σχεδόν τα πάντα. Οι συγχρονισμοί ΗΔΥΚΑ (λεπτά ο
  # καθένας, κάθε 5′) τις γέμιζαν και πίσω τους περίμεναν email ανάκτησης κωδικού, SMS,
  # παραστατικά, παραγγελίες. Τώρα κάθε είδος δουλειάς έχει δικό του δρόμο ΚΑΙ δικές του
  # θέσεις: ένας κορεσμένος ή κολλημένος δρόμος ΔΕΝ μπορεί να λιμοκτονήσει τους άλλους.
  #
  # Το όνομα «worker» ΔΕΝ αλλάζει επίτηδες (το περιμένει το deploy.sh) — είναι ο γρήγορος.
  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    # ΜΟΝΟ «fast»: κάποιος άνθρωπος περιμένει — δεν επιτρέπεται να μπλοκάρεται από τίποτα.
    command: celery -A app.workers.celery_app worker -l info --concurrency 3 --max-tasks-per-child 200 -Q fast -n fast@%h
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d fast@$$(hostname) --timeout 8 >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 90s
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - "./infra/docker/vault/tls/vault.crt:/vault/tls/vault.crt:ro"
  worker-sync:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    command: celery -A app.workers.celery_app worker -l info --concurrency 2 --max-tasks-per-child 200 -Q sync -n sync@%h
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d sync@$$(hostname) --timeout 8 >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 90s
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - "./infra/docker/vault/tls/vault.crt:/vault/tls/vault.crt:ro"
  # Η συντήρηση αναλαμβάνει ΚΑΙ τις δύο ΠΑΛΙΕΣ ουρές (celery/default) — όχι ο γρήγορος.
  # ΓΙΑΤΙ: μετά τον χωρισμό, η «celery» κρατούσε 1.077 ΠΑΛΙΕΣ εργασίες από το 9ωρο κενό της
  # 19/09 (774 μόνο συγχρονισμοί ΗΔΥΚΑ). Όσο τις κουβαλούσε ο γρήγορος, οι 3 θέσεις του ήταν
  # πιασμένες με ώρες-παλιά διπλότυπα και τα email/SMS περίμεναν από πίσω — δηλαδή ακριβώς η
  # λιμοκτονία που ο χωρισμός υπάρχει για να εξαλείψει. Καμία εργασία δεν χάνεται· απλώς
  # αδειάζουν σε δρόμο όπου δεν ενοχλούν. Όταν αδειάσουν, οι ουρές μένουν κενές για πάντα.
  worker-maint:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    command: celery -A app.workers.celery_app worker -l info --concurrency 1 --max-tasks-per-child 100 -Q maintenance,celery,default -n maint@%h
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d maint@$$(hostname) --timeout 8 >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 90s
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - "./infra/docker/vault/tls/vault.crt:/vault/tls/vault.crt:ro"
  worker-backfill:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    command: celery -A app.workers.celery_app worker -l info --concurrency 4 --max-tasks-per-child 100 -Q backfill -n backfill@%h
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d backfill@$$(hostname) --timeout 8 >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 90s
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - "./infra/docker/vault/tls/vault.crt:/vault/tls/vault.crt:ro"
  optical:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    command: celery -A app.workers.celery_app worker -l info --concurrency 3 --max-tasks-per-child 100 -Q optical -n optical@%h
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d optical@$$(hostname) --timeout 8 >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 90s
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - "./infra/docker/vault/tls/vault.crt:/vault/tls/vault.crt:ro"
  web:
    build:
      context: ./frontend
      target: runner
      args:
        NEXT_PUBLIC_API_BASE: "/api/v1"
    restart: unless-stopped
    env_file: .env
    depends_on: [api]
    expose: ["3000"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    # Drop all caps but keep NET_BIND_SERVICE so it can still bind the privileged ports 80/443.
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]
    ports: ["80:80", "443:443"]
    volumes:
      - "./infra/docker/Caddyfile:/etc/caddy/Caddyfile:ro"
      - "./infra/docker/caddy/cf-origin-pull-ca.pem:/etc/caddy/cf-origin-pull-ca.pem:ro"
      - "caddy_data:/data"
      - "caddy_config:/config"
    depends_on: [web, api]
volumes: {caddy_data: {}, caddy_config: {}}
