name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend (ruff · mypy · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check .
      # ΤΟ ΔΙΧΤΥ ΑΣΦΑΛΕΙΑΣ ΤΟΥ ΕΝΟΣ ΚΑΝΟΝΑ: καμία raw πρόσβαση σε tenant collection χωρίς tenant_id.
      # Το test_invariants καλύπτει το BaseRepository· αυτό καλύπτει τα σημεία που το ΠΑΡΑΚΑΜΠΤΟΥΝ.
      - name: Tenant-isolation lint
        working-directory: .
        run: python3 scripts/ci/check_tenant_isolation.py
      - name: Pytest
        run: pytest -q
      # Not yet enforced — the codebase has not had a full type pass. Surfaces
      # issues without blocking; flip to a hard gate once clean.
      - name: Mypy (advisory)
        run: mypy app
        continue-on-error: true

  frontend:
    name: Frontend (tsc · lint · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm install
      # Advisory while next.config.js sets ignoreBuildErrors/ignoreDuringBuilds.
      # The goal is to drive these to zero, then remove the ignores + continue-on-error.
      - name: Type-check (advisory)
        run: npm run typecheck
        continue-on-error: true
      - name: Lint (advisory)
        run: npm run lint
        continue-on-error: true
      - name: Build
        run: npm run build

  security:
    name: Security (deps · secrets · IaC scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks needs full history to scan all commits
      # Python dependency CVE scan against the pinned lockfile (H-5).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit (Python deps)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.lock --strict || true   # advisory first; flip to hard gate once clean
      # Secret scanning across the whole history — fails the build on any leaked credential.
      - name: gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      # Filesystem + dependency + IaC (Dockerfile/compose) vulnerability scan.
      - name: Trivy (fs + config)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "0"   # advisory first; set to "1" to enforce once triaged
          ignore-unfixed: true
      # SBOM (Software Bill of Materials) — inventory of every dependency, archived as a build artifact.
      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: rxvision-sbom.spdx.json
